<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | sciClaw</title>
    <meta name="robots" content="noindex" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap");

      :root {
        --bg: #f8fafc;
        --paper: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --border: #dbe3ee;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
        --accent-hover: #0d655b;
        --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
        --serif: "Fraunces", "Times New Roman", serif;
        --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(circle at 10% 10%, #d9f8f2 0%, transparent 35%),
          radial-gradient(circle at 95% 0%, #dbeafe 0%, transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.7;
      }

      a { color: var(--accent); }
      a:hover { color: var(--accent-hover); }

      .wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        max-width: 880px;
        margin: 0 auto;
      }

      .brand {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 18px;
        color: var(--ink);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }

      .nav-links { display: flex; align-items: center; gap: 18px; }

      .util {
        text-decoration: none;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }
      .util:hover { color: var(--accent); }

      article { padding: 60px 0 80px; text-align: center; }

      article h1 {
        font-family: var(--serif);
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 8px;
      }

      article .code {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 20px;
      }

      article p {
        font-size: 15px;
        color: var(--ink);
        margin: 0 0 16px;
        line-height: 1.75;
      }

      footer {
        margin-top: 24px;
        padding: 16px 0;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid var(--border);
      }

      footer a { color: var(--muted); text-decoration: underline; }
      footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">
        <span class="brand-dot" aria-hidden="true"></span>
        sciClaw
      </a>
      <nav class="nav-links">
        <a class="util" href="/docs.html">Docs</a>
        <a class="util" href="/philosophy.html">Philosophy</a>
        <a class="util" href="https://github.com/drpedapati/sciclaw" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </header>

    <main class="wrap">
      <article>
        <h1>Page not found</h1>
        <p class="code">404</p>
        <p>The page you asked for doesn't exist. It may have moved, or the address may have a typo.</p>
        <p><a href="/">Go to the sciClaw homepage</a> &middot; <a href="/docs.html">Browse the docs</a> &middot; <a href="/section-install.html">Install sciClaw</a></p>
      </article>

      <footer>
        <a href="/">sciClaw</a> is open source (MIT). Built on <a href="https://github.com/sipeed/picoclaw">PicoClaw</a> by Sipeed.
      </footer>
    </main>
  </body>
</html>
